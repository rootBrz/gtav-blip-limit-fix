name: release

on:
  # Bump VERSION on main to release. Other pushes do not run this workflow.
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

  release:
    needs: unit
    runs-on: windows-latest
    env:
      NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Publishes only on a push whose VERSION is untagged. A manual run is a dry
      # run: it builds, tests and previews the changelog, and publishes nothing.
      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          [[ $v =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Invalid VERSION: '$v'"; exit 1; }
          release=false
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already exists; not releasing"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            release=true
          fi
          { echo "release=$release"; echo "version=$v"; echo "tag=v$v"; } >> "$GITHUB_OUTPUT"

      - uses: microsoft/setup-msbuild@v2

      # Only inc/main.h and lib/ScriptHookV.lib. The SDK may not be redistributed,
      # so it lives in a repository secret, never in the tree.
      - name: Restore ScriptHookV SDK
        shell: bash
        env:
          SDK_B64: ${{ secrets.SCRIPTHOOKV_SDK_B64 }}
        run: |
          test -n "$SDK_B64" || { echo "SCRIPTHOOKV_SDK_B64 secret is not set"; exit 1; }
          mkdir sdk
          printf '%s' "$SDK_B64" | base64 -d | tar -xz -C sdk

      - name: Build and run tests
        shell: pwsh
        run: |
          $common = '/p:Platform=x64', '/p:PlatformToolset=v143', '/v:minimal'
          msbuild BlipLimitFix.vcxproj /p:Configuration=ConfigTest @common
          msbuild BlipLimitFix.vcxproj /p:Configuration=MemoryTest @common
          .\build\config_test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\build\memory_test.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build release
        run: msbuild BlipLimitFix.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:ScriptHookSdkDir=${{ github.workspace }}\sdk\" /v:minimal

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\BlipLimitFix.asi, dist\BlipLimitFix.ini -DestinationPath BlipLimitFix-Enhanced.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BlipLimitFix-Enhanced
          path: BlipLimitFix-Enhanced.zip

      # Changelog = commit subjects since the previous version tag.
      - name: Write changelog
        if: steps.ver.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          git log --no-merges --pretty='- %s' "$range" > notes.md
          [ -s notes.md ] || echo "- No changes listed" > notes.md
          {
            echo "changelog<<EOF_NOTES"
            cat notes.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Changelog for ${{ steps.ver.outputs.tag }} (publish: ${{ steps.ver.outputs.release }})"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: gh release create "$TAG" BlipLimitFix-Enhanced.zip --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

      # Skipped until the NEXUSMODS_API_KEY secret exists.
      - name: Upload to Nexus Mods
        if: steps.ver.outputs.release == 'true' && env.NEXUS_KEY != ''
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: BlipLimitFix-Enhanced.zip
          version: ${{ steps.ver.outputs.version }}
          changelog: ${{ steps.notes.outputs.changelog }}
          category: main
          archive_existing_version: true
          update_mod_version: true
